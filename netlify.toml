[build]
  command = "pnpm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[images]
  remote_images = [
    "https://api.nasa.gov/.*",
    "https://apod.nasa.gov/.*",
    "https://images-assets.nasa.gov/.*",
    "https://img.youtube.com/.*",
    "https://.*\\.nasa\\.gov/.*",
    "https://images.unsplash.com/.*"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; media-src 'self' https:; frame-src 'self' https://www.youtube.com https://player.vimeo.com; connect-src 'self' https://api.nasa.gov https://*.nasa.gov https://wsrv.nl https://images.unsplash.com;"
